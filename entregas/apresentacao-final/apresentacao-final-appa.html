ho; as sa\xEDdas n\xE3o encerram uma conclus\xE3o sobre o tr\xE2nsito."},{title:"A pergunta que orienta o estudo",part:"Motiva\xE7\xE3o",speaker:"Arthur",tone:"paper",note:"Distinguir o perfil dos boletins do risco por ve\xEDculo. A base s\xF3 cont\xE9m ocorr\xEAncias registradas. Perguntamos quais caracter\xEDsticas est\xE3o associadas \xE0 classifica\xE7\xE3o desses boletins nos hor\xE1rios definidos como pico."},{title:"Do arquivo bruto ao recorte",part:"Banco de dados",speaker:"Arthur",tone:"ink",note:"Apresentar o Infosiga/SP e a unidade: um boletim fatal ou n\xE3o fatal. Mostrar 273.371 registros brutos, 151.833 boletins, 242 sem data/hora v\xE1lidas e 416 sem via entre os restantes. Chegamos a 151.175. Notifica\xE7\xF5es n\xE3o integram o ajuste."},{title:"O alvo \xE9 uma regra de hor\xE1rio",part:"Vari\xE1vel-alvo",speaker:"Arthur",tone:"mint",note:"Demonstrar a r\xE9gua de 24 horas. Alterar o hor\xE1rio para 06:29 e 06:30 e mostrar a fronteira. As tr\xEAs janelas s\xE3o definidas pelo grupo e incluem os extremos. Elas n\xE3o foram descobertas por um modelo de congestionamento."},{title:"Tr\xEAs preditoras entram no modelo",part:"Preditoras",speaker:"Pedro",tone:"paper",note:"Explicar via, dia da semana e regi\xE3o. Os fatores geram 22 indicadores, mais intercepto. Hora e turno revelam o alvo e ficam fora. A data completa divide treino e teste. Diferenciar dos 11 candidatos hist\xF3ricos da Entrega 1."},{title:"Uma ferramenta: regress\xE3o log\xEDstica",part:"Ferramenta escolhida",speaker:"Pedro",tone:"indigo",note:"A ferramenta produz probabilidades entre zero e um para um alvo bin\xE1rio. Mostrar a f\xF3rmula e a chamada glm. A escolha se apoia na adequa\xE7\xE3o \xE0 tarefa, sem declarar uma vencedora. PCA e Poisson est\xE3o em atividades separadas."},{title:"Treinar no passado, aplicar depois",part:"Treino e teste",speaker:"Pedro",tone:"ink",note:"Mostrar o corte temporal: 101.666 boletins de 2025 para ajustar, 49.509 de 2026 para avaliar. N\xE3o h\xE1 ajuste no teste, nem escolha do limiar usando os resultados. \xC9 retrospectivo, pois a base j\xE1 foi explorada."},{title:"Um perfil entra, uma probabilidade sai",part:"Demonstra\xE7\xE3o do ajuste",speaker:"Pedro",tone:"paper",note:"Trocar uma categoria de cada vez. A probabilidade \xE9 calculada com os coeficientes reais do ajuste de 2025, sem novo treinamento. Ressaltar que ela se refere a pertencer ao pico entre boletins, e n\xE3o a prever se um ve\xEDculo sofrer\xE1 sinistro."},{title:"O relat\xF3rio do R acompanha o ajuste",part:"Relat\xF3rio da ferramenta",speaker:"Pedro",tone:"ink",note:"Mostrar coeficientes, o efeito condicional de via e a raz\xE3o de chances. O console completo e todas as tabelas est\xE3o no artigo e no c\xF3digo. O intervalo de via cont\xE9m valores pr\xF3ximos de um. Erros convencionais do summary e agrupados por data s\xE3o procedimentos distintos."},{title:"Probabilidades avaliadas em 2026",part:"Resultados",speaker:"Ailana Pereira Gonsalez",tone:"paper",note:"Ler Brier e AUC, com a refer\xEAncia constante calculada no treino. AUC 0,5757 e Brier 0,237184 s\xE3o registros da execu\xE7\xE3o. A acur\xE1cia muito pr\xF3xima da majorit\xE1ria n\xE3o demonstra boa detec\xE7\xE3o de pico."},{title:"O limiar muda a classifica\xE7\xE3o",part:"Intera\xE7\xE3o com o teste",speaker:"Ailana Pereira Gonsalez",tone:"ink",note:"Come\xE7ar no limiar 0,5: 371 verdadeiros positivos e 19.718 falsos negativos, sensibilidade 1,85%. Mover o limiar para ilustrar a troca entre erros. Esta explora\xE7\xE3o usa o teste e n\xE3o serve para selecionar um limiar ou reportar desempenho n\xE3o enviesado."},{title:"Calibra\xE7\xE3o e varia\xE7\xE3o entre meses",part:"Diagn\xF3sticos",speaker:"Ailana Pereira Gonsalez",tone:"mint",note:"No gr\xE1fico de calibra\xE7\xE3o, a diagonal \xE9 uma refer\xEAncia e o tamanho dos pontos representa n. Mostrar a varia\xE7\xE3o mensal da AUC. Valores agregados e seis meses de teste n\xE3o asseguram estabilidade futura."},{title:"Tes
