 a raz\xE3o de chances ajustada \xE9 0,9663. O intervalo com agrupamento por data vai de 0,9328 a 1,0010. S\xE3o as chances de pertencer ao pico, mantendo dia e regi\xE3o no ajuste. Esse n\xFAmero n\xE3o \xE9 uma probabilidade nem indica que uma via proteja contra sinistros. Os testes e o relat\xF3rio completo est\xE3o no apoio. Um valor de p tamb\xE9m n\xE3o mede relev\xE2ncia pr\xE1tica ou causalidade.",action:"Apontar 1 como refer\xEAncia e explicar o contraste antes do intervalo.",transition:"Arthur re\xFAne as condi\xE7\xF5es que limitam essa leitura."},{kind:"limits",title:"O alcance depende do recorte, da regra e do protocolo",part:"Discuss\xE3o do procedimento",speaker:"Arthur Galv\xE3o",tone:"paper",seconds:35,support:!1,message:"Limita\xE7\xF5es se conectam \xE0s decis\xF5es; n\xE3o s\xE3o uma lista gen\xE9rica de ressalvas.",visual:"Exclus\xF5es \u2192 popula\xE7\xE3o; janelas \u2192 alvo; teste conhecido \u2192 alcance temporal.",note:"656 exclu\xEDdos fatais. Janelas sem fluxo. Teste conhecido. Mesmos X recebem o mesmo p.",talk:"O recorte perdeu registros sobretudo fatais. As janelas n\xE3o foram validadas com fluxo de ve\xEDculos. E o teste j\xE1 era conhecido. Al\xE9m disso, boletins com as mesmas tr\xEAs caracter\xEDsticas recebem a mesma probabilidade, mesmo quando os hor\xE1rios diferem. S\xE3o condi\xE7\xF5es da an\xE1lise. N\xE3o medimos se acrescentar uma vari\xE1vel resolveria o problema e n\xE3o avaliamos uma interven\xE7\xE3o de seguran\xE7a vi\xE1ria.",action:"Pausa curta entre as tr\xEAs condi\xE7\xF5es.",transition:"Ailana retorna ao n\xFAmero com que come\xE7amos."},{kind:"closing",title:"O que os acertos mostram",part:"Fechamento da etapa demonstrativa",speaker:"Ailana Pereira Gonsalez",tone:"indigo",seconds:25,support:!1,message:"A contribui\xE7\xE3o da etapa \xE9 interpretar a execu\xE7\xE3o e seus limites.",visual:"Dois denominadores, pergunta inicial e acesso ao material.",note:"Todos: 59,43%. S\xF3 os de pico: 371 de 20.089. A difer
